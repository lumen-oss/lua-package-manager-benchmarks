---
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches:
      - main
  workflow_dispatch:

name: Benchmarks

jobs:
  non-nix-run:
    permissions:
      contents: read
      pull-requests: read
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        os: ["ubuntu-24.04"]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Lua, etc
        run: |
          sudo apt-get update
          sudo apt-get install -y liblua5.1-0-dev pkg-config

      - name: Install Lux
        uses: lumen-oss/gh-actions-lux@v1
        with:
          version: 0.40.1

      - name: Install hyperfine
        uses: taiki-e/install-action@hyperfine

      - name: Lux test run
        run: |
          lx config show
          lx debug toolchains
        env:
          RUST_LOG: trace

      - name: Run hyperfine
        run: |
          TMPBASE=$(mktemp -d)
          trap 'rm -rf "$TMPBASE"' EXIT

          hyperfine \
            --warmup 1 \
            --runs 10 \
            --prepare "rm -rf $TMPBASE/lux" "lx --tree $TMPBASE/lux install busted"
